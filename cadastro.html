<!DOCTYPE html>
<html lang="pt-BR">
    

<head>
  <meta charset="UTF-8">
  <title>Cadastro - Pagina Principal</title>
</head>

<body>
 <header>
  <nav>
    <a href="PaginaPrincipal.html#Inicio" target="_self">Início|</a>
    <a href="produtoseservicos.html" target="_self">Produtos e Serviços|</a>
    <a href="SobrePetshop.html" target="_self">Sobre|</a>
    <a href="cadastro.html" target="_self">Cadastro</a>
   </nav>
 </header>

 
 <main id="topo">
  <img src="img/img2.jpg" alt="Na imagem há dois Cachorros um preto e um laranja, dois gatos um cinza e um cinza escuro, 
   um coelho branco e um papagaio verde.">
  <h2>Envie seu email para receber descontos e promoções!</h2>

  <form>
  <p>
    <label for="nome">Seu nome ou apelido</label><br>
    <input type="text" id="nome" name="nome" required>
  </p>
  
  <p>
    <label for="email">Insira seu E-mail</label><br>
    <input type="email" id="email" name="email" required>
  </p>
  
  <p>
    <label for="tel">Insira seu Telefone</label><br>
    <input type="tel" id="tel" name="tel" required>
  </p>

  <p>
    <label for="animal">Qual é o seu pet?</label><br>
    <select id="animal" name="animal">
    <option value="cachorro">Cachorro</option>
    <option value="gato">Gato</option>
    <option value="passaro">Pássaro</option>
    <option value="coelho">Coelho</option>
    <option value="outro">Outro</option>
    </select>
  </p>

  <p>
    <label for="pet">Conte um pouco mais sobre seu pet</label><br>
    <textarea id="pet" name="pet"></textarea>
  </p>
  
  <button type="submit">Enviar </button>
  </form>

 </main>
 
 <footer>
  
  <p>&copy; 2026 Petshop, Todos os direitos reservados.</p>
  
  <nav>
    <a href="">Política de Privacidade</a>
    <a href="">Termos de Uso</a>
    <a href="#topo">Voltar ao topo</a>
  </nav>

</footer>

</body>

</html>
